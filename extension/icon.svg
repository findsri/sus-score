<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="#0a0a0f"/>
  <circle cx="64" cy="64" r="60" fill="none" stroke="#2f80c0" stroke-width="3"/>

  <!-- Magnifying glass circle (right, larger) -->
  <circle cx="72" cy="56" r="22" fill="none" stroke="#7ec8e3" stroke-width="5" stroke-linecap="round"/>
  <!-- Magnifying glass handle -->
  <line x1="88" y1="72" x2="104" y2="90" stroke="#7ec8e3" stroke-width="6" stroke-linecap="round"/>

  <!-- Detective glasses left lens -->
  <circle cx="38" cy="72" r="13" fill="none" stroke="#2f80c0" stroke-width="4"/>
  <!-- Detective glasses right lens (shares border with left) -->
  <circle cx="64" cy="72" r="13" fill="none" stroke="#2f80c0" stroke-width="4"/>
  <!-- Bridge between lenses -->
  <line x1="51" y1="72" x2="51" y2="72" stroke="#2f80c0" stroke-width="4" stroke-linecap="round"/>
  <!-- Left arm -->
  <line x1="25" y1="72" x2="18" y2="68" stroke="#2f80c0" stroke-width="4" stroke-linecap="round"/>
  <!-- Right arm -->
  <line x1="77" y1="72" x2="84" y2="68" stroke="#2f80c0" stroke-width="4" stroke-linecap="round"/>

  <!-- Small glint inside magnifying glass -->
  <circle cx="65" cy="49" r="3" fill="#7ec8e3" opacity="0.6"/>
</svg>
