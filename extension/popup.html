<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dark Pattern Detector</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      min-height: 200px;
      background: #0a0a0f;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
    }
    .header {
      padding: 14px 16px;
      border-bottom: 1px solid #1e1e2e;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo {
      width: 28px; height: 28px;
      background: #7c3aed;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
    }
    .title { font-weight: 700; font-size: 13px; }
    .subtitle { font-size: 10px; color: #6b7280; }
    .body { padding: 16px; }
    .score-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #13131a;
      border: 1px solid #1e1e2e;
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 12px;
    }
    .score-value {
      font-size: 28px;
      font-weight: 800;
    }
    .score-label { font-size: 11px; color: #6b7280; }
    .patterns-list { space-y: 6px; }
    .pattern-item {
      background: #13131a;
      border: 1px solid #1e1e2e;
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 6px;
      display: flex;
      gap: 8px;
      align-items: flex-start;
    }
    .severity-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      margin-top: 4px;
      flex-shrink: 0;
    }
    .pattern-desc { font-size: 11px; color: #94a3b8; line-height: 1.4; }
    .loading { text-align: center; padding: 24px; color: #6b7280; }
    .spinner {
      width: 20px; height: 20px;
      border: 2px solid #1e1e2e;
      border-top-color: #7c3aed;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .cta-btn {
      display: block;
      width: 100%;
      padding: 8px;
      background: #7c3aed;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      margin-top: 12px;
    }
    .cta-btn:hover { background: #6d28d9; }
    .empty { text-align: center; color: #6b7280; padding: 12px 0; font-size: 12px; }
    .badge-tag {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
    </div>
    <div>
      <div class="title">Dark Pattern Detector</div>
      <div class="subtitle">Real-time dark pattern analysis</div>
    </div>
  </div>

  <div class="body">
    <div id="loading" class="loading">
      <div class="spinner"></div>
      Scanning current page…
    </div>
    <div id="results" style="display:none"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
